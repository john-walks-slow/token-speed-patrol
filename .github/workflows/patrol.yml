name: Token Speed Patrol

on:
  schedule:
    # 巡检周期在此配置（cron 表达式）；当前每 1 小时一次，37 分错开整点。
    # 频率依据：docs/features/260923-provider-coverage/260923-rate-limit-policy.research.md
    # GitHub Actions 高峰期会丢 scheduled run，实际频率低于名义值，属预期。
    - cron: '37 * * * *'
  workflow_dispatch: # 手动触发，用于首次验证与按需重跑
    inputs:
      providers:
        description: '仅巡检指定 provider（逗号分隔 provider_name，留空 = 全部）'
        required: false
        default: ''

permissions:
  contents: write # 需要提交巡检结果到仓库

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run patrol
        env:
          # 所有密钥统一走 PATROL_EXTRA_ENV（多行 KEY=VALUE），按 patrol.json 的 api_key_env 名对应
          PATROL_EXTRA_ENV: ${{ secrets.PATROL_EXTRA_ENV }}
          PATROL_PROVIDERS: ${{ inputs.providers || '' }}
        run: python -m backend.patrol_runner

      - name: Prune old data files
        run: |
          # 看板展示最多 14 天，超期 JSONL 清掉，仓库 data 目录不再无限膨胀（历史仍可从 git log 追溯）
          find website/data -name '*.jsonl' -mtime +14 -delete
          if [ -n "$(git status --porcelain website/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A website/data
            git commit -m "patrol: prune data older than 14 days"
          fi

      - name: Commit patrol results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/data/
          git commit -m "patrol: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          # 巡检运行期间 master 可能有新提交（否则 push 被拒、数据丢失）：rebase 后重试
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && exit 0
            sleep 5
          done
          echo "::error::failed to push patrol results"
          exit 1
