<style>

  --text-dim: #9aa7b2;
  --text-faint: #5f6b76;

  --red: #f87171;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --chart-1: #34d399;
  --chart-2: #60a5fa;
  --chart-3: #fbbf24;
  --chart-4: #c084fc;
  --chart-5: #22d3ee;
  --chart-6: #facc15;
  --chart-7: #94a3b8;
  --chart-8: #fb7185;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
::selection { background: rgba(52, 211, 153, 0.25); }
a { color: inherit; text-decoration: none; }

.bg-grid {
  position: fixed; inset: 0; z-index: -2;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, black 40%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, black 40%, transparent 100%);
}
.glow {
  position: fixed; z-index: -1; border-radius: 50%; filter: blur(110px); pointer-events: none;
}
.glow-a { width: 560px; height: 380px; top: -140px; left: 50%; transform: translateX(-50%); background: rgba(16, 185, 129, 0.1); }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

/* nav */
nav {
  position: sticky; top: 0; z-index: 50;

.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 60px; }

.brand-logo {
  width: 28px; height: 28px; border-radius: 8px; background: var(--green-soft);
  display: grid; place-items: center; flex-shrink: 0;
}
.brand-logo svg { width: 16px; height: 16px; }
.nav-links { display: flex; align-items: center; gap: 20px; font-size: 13px; color: var(--text-dim); }
.nav-github {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--card);
  color: var(--text-dim); transition: all .15s;
}
.nav-github:hover { color: var(--text); border-color: var(--border-strong); }

/* hero */
header { padding: 48px 0 32px; }
h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 14px; }
h1 .grad { background: linear-gradient(120deg, #34d399 20%, #6ee7b7 45%, #a7f3d0 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-sub { font-size: 15.5px; color: var(--text-dim); max-width: 640px; }
.last-run { margin-top: 10px; font-size: 12px; color: var(--text-faint); font-family: var(--mono); }

/* metric cards */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 36px; }
@media (min-width: 900px) { .metrics { grid-template-columns: repeat(6, 1fr); } }
.metric-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;

}
.metric-card:hover { background: var(--card-hover); border-color: var(--border-strong); }

.metric-card .value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* section */

.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }

/* trend legend */

/* empty / loading */
.empty, .loading { text-align: center; padding: 60px 0; color: var(--text-faint); font-size: 14px; }

@keyframes spin { to { transform: rotate(360deg); } }

/* footer */
footer { border-top: 1px solid var(--border); padding: 32px 0; margin-top: 20px; }

<script>
// ── 数据加载 ──────────────────────────────────────

const CHART_COLORS = ['#34d399','#60a5fa','#fbbf24','#c084fc','#22d3ee','#facc15','#94a3b8','#fb7185','#4ade80','#38bdf8','#f472b6','#a3e635','#fb923c','#818cf8','#2dd4bf','#e879f9'];
const METRIC_LABELS = {
  tps: '有效速度 (tok/s)',
  itl_ms: 'ITL (ms/tok)',
  ttft_ms: 'TTFT (ms)',
  total_latency_ms: '延迟 (ms)',
  success_rate: '成功率 (%)',
};
const SPARK_WINDOW_MS = 24 * 3600 * 1000;
// 初始加载 7 天；14 天档按需懒加载更多历史
const PRELOAD_DAYS = 7;
const MAX_DAYS = 14;
const RANGE_DEFS = {
  latest: { label: '最近一次', windowMs: 0 },
  '24h':  { label: '最近 24 小时', windowMs: SPARK_WINDOW_MS },
  '7d':   { label: '最近 7 天', windowMs: 7 * 24 * 3600 * 1000 },
  '14d':  { label: '最近 14 天', windowMs: MAX_DAYS * 24 * 3600 * 1000, lazy: true },
};

let allRuns = [];      // 按时间升序的 run 记录
let loadedDays = 0;    // 已加载的天数（懒加载进度）
let activeMetric = 'tps';
let activeRange = '24h';
let activeProviders = new Set(); // 空 = 全选
let activeKeys = new Set();      // 趋势图选中的 (provider|model) 对
let providerColor = {}; // provider -> 颜色

// 表格排序状态：col ∈ {'provider','model','success_rate','tps','itl_ms','ttft_ms','total_latency_ms','count'}
// 默认按 score（TPS × 成功率，隐藏列——快且稳定可用的排前面，纯快但常挂的靠后）降序
let sortCol = 'score';
let sortDir = 'desc';

function providerOf(r) {
  return r.provider_name || hostnameOf(r.base_url) || 'unknown';
}

function colorOf(provider) {
  return providerColor[provider] || CHART_COLORS[Object.keys(providerColor).length % CHART_COLORS.length];
}

function assignProviderColors(runs) {
  const providers = new Set();
  for (const run of runs) for (const r of run.results) providers.add(providerOf(r));
  for (const p of [...providers].sort()) {
    if (!providerColor[p]) providerColor[p] = CHART_COLORS[Object.keys(providerColor).length % CHART_COLORS.length];
  }
}

// 加载 data/ 下最近 N 天的 JSONL 文件（GitHub Pages 静态站无目录列举，用固定文件名）
async function loadAllData(days) {
  const files = await discoverJsonlFiles(days);
  const all = [];
  for (const f of files) {
    try {
      const resp = await fetch(f + '?t=' + Date.now());
      if (!resp.ok) continue;
      const text = await resp.text();
      for (const line of text.trim().split('\n')) {
        if (!line) continue;
        all.push(JSON.parse(line));
      }
    } catch (e) { /* 文件可能不存在，跳过 */ }
  }
  all.sort((a, b) => a.started_at.localeCompare(b.started_at));
  return all;
}

// 懒加载：初始只取 7 天，切到 14 天档时补拉更早的历史（更旧的在 git log 里永远可追溯）
async function extendLoadedDays(targetDays) {
  if (loadedDays >= targetDays) return;
  const newRuns = await loadAllData(targetDays);
  if (newRuns.length > allRuns.length) {
    allRuns = newRuns;
    assignProviderColors(allRuns);
  }
  loadedDays = Math.max(loadedDays, targetDays);
}

// 探测可用的 JSONL 文件：尝试最近 N 天 + 今天
async function discoverJsonlFiles(days) {
  const files = [];
  const now = new Date();
  for (let i = 0; i <= days; i++) {
    const d = new Date(now.getTime() - i * 86400000);
    const y = d.getUTCFullYear();
    const m = String(d.getUTCMonth() + 1).padStart(2, '0');
    const day = String(d.getUTCDate()).padStart(2, '0');
    files.push(`data/${y}-${m}-${day}.jsonl`);
  }
  // 探测哪些存在（HEAD 请求）；fetch 不支持 HEAD 的跨域限制少，Pages 同源没问题
  const existing = [];
  await Promise.all(files.map(async f => {
    try {
      const resp = await fetch(f, { method: 'HEAD' });
      if (resp.ok) existing.push(f);
    } catch {}
  }));
  return existing;
}

// ── 数据处理（与 StatsPanel 逻辑对齐）──────────────

function pairKey(r) {
  return `${providerOf(r)}|${r.model}`;
}

function hostnameOf(url) {
  if (!url) return 'unknown';
  try { return new URL(url).hostname || 'unknown'; } catch { return url; }
}

function median(nums) {
  if (!nums.length) return 0;
  const s = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

// 从一条 run 提取每个 (provider|model) 对的聚合值
function runToPoints(run) {
  const byPair = {};
  for (const r of run.results) {
    const k = pairKey(r);
    if (!byPair[k]) byPair[k] = { success: [], tps: [], itl: [], ttft: [], latency: [], model: r.model, provider: r.provider_name || hostnameOf(r.base_url) };
    byPair[k].success.push(r.success);
    if (r.success) {
      if (r.tps != null) byPair[k].tps.push(r.tps);
      if (r.itl_ms != null) byPair[k].itl.push(r.itl_ms);
      if (r.ttft_ms != null) byPair[k].ttft.push(r.ttft_ms);
      if (r.total_latency_ms != null) byPair[k].latency.push(r.total_latency_ms);
    }
  }
  const points = {};
  for (const [k, d] of Object.entries(byPair)) {
    points[k] = {
      tps: d.tps.length ? median(d.tps) : null,
      itl_ms: d.itl.length ? median(d.itl) : null,
      ttft_ms: d.ttft.length ? median(d.ttft) : null,
      total_latency_ms: d.latency.length ? median(d.latency) : null,
      success_rate: d.success.length ? Math.round(d.success.filter(x=>x).length / d.success.length * 1000) / 10 : 0,
      count: d.success.length,
      model: d.model,
      provider: d.provider,
    };
  }
  return points;
}

// ── 渲染 ──────────────────────────────────────────

// provider chip 筛选（空 activeProviders = 全选）
function providerVisible(provider) {
  return activeProviders.size === 0 || activeProviders.has(provider);
}

function renderProviderChips() {
  const providers = Object.keys(providerColor);
  const el = document.getElementById('providerChips');
  const group = document.getElementById('providerFilters');
  // 按当前时间范围统计模型数（按 modelid 去重），范围内无数据的 provider 不显示
  const modelSets = {};
  for (const run of runsInRange()) for (const r of run.results) {
    const p = providerOf(r);
    if (!modelSets[p]) modelSets[p] = new Set();
    modelSets[p].add(r.model);
  }
  const shown = providers.filter(p => modelSets[p]);
  // 少于 2 个可选 provider 时不显示筛选组
  if (providers.length < 2 || !shown.length) { group.style.display = 'none'; return; }
  group.style.display = '';
  const active = activeProviders.size === 0 ? '__all__' : [...activeProviders][0];
  const chipFor = (key, label, extra) =>
    `<button class="chip${active === key ? ' active' : ''}" data-provider="${key}">${extra || ''}${escapeHtml(label)}</button>`;
  el.innerHTML =
    chipFor('__all__', '全部') +
    shown.map(p => chipFor(p, `${p} ${modelSets[p].size}`, `<span class="chip-dot" style="background:${colorOf(p)}"></span>`)).join('');
  el.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      // 单选：点"全部"或重复点击当前项 = 恢复全部
      const p = btn.dataset.provider;
      activeProviders = p === '__all__' ? new Set() : new Set([p]);
      renderProviderChips();
      renderResults();
      drawChart();
    });
  });
}

function renderLastRun(latestRun) {
  const el = document.getElementById('lastRun');
  if (!latestRun) { el.textContent = '—'; return; }
  const d = new Date(latestRun.finished_at || latestRun.started_at);
  el.textContent = `上次巡检：${d.toLocaleString()} · ${latestRun.success}/${latestRun.total} 成功`;
}

function renderMetrics(latestRun) {
  const el = document.getElementById('metrics');
  if (!latestRun) { el.innerHTML = ''; return; }
  const points = runToPoints(latestRun);
  const allResults = latestRun.results;
  const successResults = allResults.filter(r => r.success);
  const tpsVals = successResults.filter(r => r.tps != null).map(r => r.tps);
  const itlVals = successResults.filter(r => r.itl_ms != null).map(r => r.itl_ms);
  const latencyVals = successResults.map(r => r.total_latency_ms);
  const ttftVals = successResults.filter(r => r.ttft_ms != null).map(r => r.ttft_ms);
  const total = allResults.length;
  const successRate = total ? Math.round(successResults.length / total * 100) : 0;

  const cards = [
    { label: '测试模型', value: Object.keys(points).length },
    { label: '成功率', value: `${successRate}%`, sub: `${successResults.length}/${total}` },
    { label: '中位 TPS', value: tpsVals.length ? median(tpsVals).toFixed(1) : 'N/A', sub: 'tok/s' },
    { label: '中位 ITL', value: itlVals.length ? formatItl(median(itlVals)) + 'ms' : 'N/A', sub: 'ms/tok' },
    { label: '中位延迟', value: latencyVals.length ? Math.round(median(latencyVals)) + 'ms' : 'N/A' },
    { label: '中位 TTFT', value: ttftVals.length ? Math.round(median(ttftVals)) + 'ms' : 'N/A' },
  ];
  el.innerHTML = cards.map(c =>
    `<div class="metric-card"><div class="label">${c.label}</div><div class="value">${c.value}</div>${c.sub ? `<div class="sub">${c.sub}</div>` : ''}</div>`
  ).join('');
}

// 取某 pair 在当前时间范围内的指标序列：[{time, value}]
function sparkSeries(pair) {
  const tEnd = new Date(allRuns[allRuns.length - 1].started_at).getTime();
  const windowMs = activeRange === 'latest' ? SPARK_WINDOW_MS : RANGE_DEFS[activeRange].windowMs;
  const series = [];
  for (const run of allRuns) {
    const t = new Date(run.started_at).getTime();
    if (t < tEnd - windowMs) continue;
    const point = runToPoints(run)[pair];
    const v = point && point[activeMetric];
    if (v != null) series.push({ time: t, value: v });
  }
  return series;
}

// 平滑曲线插值点（Catmull-Rom → bezier）
function smoothPath(ctx, pts) {
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];
    ctx.bezierCurveTo(
      p1.x + (p2.x - p0.x) / 6, p1.y + (p2.y - p0.y) / 6,
      p2.x - (p3.x - p1.x) / 6, p2.y - (p3.y - p1.y) / 6,
      p2.x, p2.y
    );
  }
}

// 当前时间范围内的 runs（latest = 仅最近一次）
function runsInRange() {
  if (activeRange === 'latest') return [allRuns[allRuns.length - 1]];
  const tEnd = new Date(allRuns[allRuns.length - 1].started_at).getTime();
  const windowMs = RANGE_DEFS[activeRange].windowMs;
  return allRuns.filter(run => new Date(run.started_at).getTime() >= tEnd - windowMs);
}

function renderResults() {
  const el = document.getElementById('resultsCard');
  const runs = runsInRange();
  if (!runs.length || !runs[0].results.length) {
    el.innerHTML = '<div class="empty">暂无巡检数据</div>'; return;
  }

  const aggByPair = {};
  for (const run of runs) {
    for (const [k, p] of Object.entries(runToPoints(run))) {
      if (!aggByPair[k]) aggByPair[k] = { model: p.model, provider: p.provider, tps: [], itl: [], ttft: [], latency: [], ok: 0, n: 0 };
      const a = aggByPair[k];
      a.n += p.count;
      a.ok += p.count * (p.success_rate / 100);
      if (p.tps != null) a.tps.push(p.tps);
      if (p.itl_ms != null) a.itl.push(p.itl_ms);
      if (p.ttft_ms != null) a.ttft.push(p.ttft_ms);
      if (p.total_latency_ms != null) a.latency.push(p.total_latency_ms);
    }
  }

  const rowsData = Object.entries(aggByPair)
    .filter(([k]) => providerVisible(k.split('|')[0]))
    .map(([k, a]) => ({
      k,
      model: a.model,
      provider: a.provider,
      success_rate: a.n ? Math.round(a.ok / a.n * 1000) / 10 : 0,
      tps: a.tps.length ? median(a.tps) : null,
      itl_ms: a.itl.length ? median(a.itl) : null,
      ttft_ms: a.ttft.length ? median(a.ttft) : null,
      total_latency_ms: a.latency.length ? median(a.latency) : null,
      count: a.n,
    }));
  if (!rowsData.length) { el.innerHTML = '<div class="empty">该 Provider 无数据</div>'; return; }

  // 隐藏排序键：TPS × 成功率（成功率 0% 的直接沉底，无 TPS 数据不参与默认排序）
  for (const r of rowsData) {
    r.score = r.tps != null ? r.tps * (r.success_rate / 100) : null;
  }

  sortRows(rowsData);

  const rows = rowsData.map(r => {
    const rateCls = r.success_rate >= 95 ? 'ok' : r.success_rate >= 50 ? 'warn-text' : 'fail';
    const fmt = (v, f) => v == null ? '—' : f(v);
    return `<tr data-pair="${escapeHtml(r.k)}">
      <td class="${rateCls}">${r.success_rate}%</td>
      <td class="model-cell">${escapeHtml(r.model)}<span class="provider">${escapeHtml(r.provider)}</span></td>
      <td>${fmt(r.tps, v => v.toFixed(1))}</td>
      <td>${fmt(r.itl_ms, v => formatItl(v) + 'ms')}</td>
      <td>${fmt(r.ttft_ms, v => Math.round(v) + 'ms')}</td>
      <td>${fmt(r.total_latency_ms, v => Math.round(v) + 'ms')}</td>
      <td>${r.count} 次</td>
      <td class="spark-cell"><canvas data-pair="${escapeHtml(r.k)}" width="120" height="30"></canvas></td>
    </tr>`;
  }).join('');

  const cols = [
    { key: 'success_rate', label: '成功率' },
    { key: 'model', label: '模型' },
    { key: 'tps', label: 'TPS' },
    { key: 'itl_ms', label: 'ITL' },
    { key: 'ttft_ms', label: 'TTFT' },
    { key: 'total_latency_ms', label: '延迟' },
    { key: 'count', label: '次数' },
    { key: 'spark', label: '趋势', title: METRIC_LABELS[activeMetric] },
  ];
  const thead = cols.map(c => {
    if (c.key === 'spark') return `<th title="${c.title}">${c.label}</th>`;
    const sorted = sortCol === c.key;
    const ind = sorted ? (sortDir === 'asc' ? '▲' : '▼') : '▲';
    return `<th class="sortable${sorted ? ' sorted' : ''}" data-sort="${c.key}" title="点击排序">${c.label}<span class="sort-ind">${ind}</span></th>`;
  }).join('');
  el.innerHTML = `<div class="table-scroll"><table class="results-table"><thead><tr>${thead}</tr></thead><tbody>${rows}</tbody></table></div>`;

  el.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.sort;
      if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = col;
        sortDir = col === 'model' || col === 'provider' ? 'asc' : 'desc';
      }
      renderResults();
    });
  });
  drawSparks();
}

function sortRows(rowsData) {
  const key = sortCol;
  const dir = sortDir === 'asc' ? 1 : -1;
  rowsData.sort((a, b) => {
    let va = a[key], vb = b[key];
    if (typeof va === 'string' || typeof vb === 'string') {
      va = va || ''; vb = vb || '';
      return va.localeCompare(vb) * dir;
    }
    // null（无数据）永远排最后，不受排序方向影响
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return (va - vb) * dir;
  });
}

// 行内 sparkline：范围内平滑曲线 + 最新值圆点，颜色跟 provider
function drawSparks() {
  document.querySelectorAll('.spark-cell canvas').forEach(cv => {
    const series = sparkSeries(cv.dataset.pair);
    if (series.length < 2) { cv.style.display = 'none'; return; }
    const ctx = cv.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = 120, h = 30;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    cv.dataset.w = w; cv.dataset.h = h;
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);

    const pair = cv.dataset.pair;
    const [provider] = pair.split('|');
    const color = colorOf(provider);
    const vals = series.map(d => d.value);
    let vMin = Math.min(...vals), vMax = Math.max(...vals);
    if (activeMetric === 'success_rate') { vMin = 0; vMax = 100; }
    if (vMax === vMin) vMax = vMin + 1;
    const tMin = series[0].time, tMax = series[series.length - 1].time;
    const pts = series.map(d => ({
      x: ((d.time - tMin) / (tMax - tMin || 1)) * (w - 4) + 2,
      y: 3 + (1 - (d.value - vMin) / (vMax - vMin || 1)) * (h - 6),
    }));
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
    ctx.beginPath();
    smoothPath(ctx, pts);
    ctx.stroke();
    const last = pts[pts.length - 1];
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.8, 0, Math.PI * 2); ctx.fill();

    // hover 命中点缓存 + 事件绑定
    sparkHitsByCanvas.set(cv, series.map((d, i) => ({
      x: pts[i].x, y: pts[i].y, time: d.time, value: d.value, color, pair,
    })));
    if (!cv.dataset.hoverBound) {
      cv.dataset.hoverBound = '1';
      bindSparkHover(cv);
    }
  });
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── 趋势图（原生 Canvas，直线折线）────────────────

let chartCanvas, chartCtx, chartHits = [];

function initChart() {
  chartCanvas = document.getElementById('trendChart');
  chartCtx = chartCanvas.getContext('2d');
  resizeChart();
  window.addEventListener('resize', resizeChart);
  bindChartHover();
}

function resizeChart() {
  if (!chartCanvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = chartCanvas.parentElement.clientWidth - 40;
  chartCanvas.width = w * dpr;
  chartCanvas.height = 320 * dpr;
  chartCanvas.style.width = w + 'px';
  chartCanvas.style.height = '320px';
  chartCtx.scale(dpr, dpr);
  drawChart();
}

function drawChart() {
  if (!chartCtx || !allRuns.length) return;
  const ctx = chartCtx;
  const w = chartCanvas.width / (window.devicePixelRatio || 1);
  const h = 320;
  ctx.clearRect(0, 0, w, h);

  // 收集所有出现过的 pair
  const allPairs = new Set();
  const seriesByPair = {}; // pair -> [{time, value}]
  for (const run of allRuns) {
    const points = runToPoints(run);
    const t = new Date(run.started_at).getTime();
    for (const [k, p] of Object.entries(points)) {
      allPairs.add(k);
      const v = p[activeMetric];
      if (v == null) continue;
      if (!seriesByPair[k]) seriesByPair[k] = [];
      seriesByPair[k].push({ time: t, value: v });
    }
  }

  const pairs = [...allPairs].filter(k => providerVisible(k.split('|')[0])).sort();
  // 默认全选
  if (activeKeys.size === 0) pairs.forEach(k => activeKeys.add(k));

  const visibleSeries = pairs.filter(k => activeKeys.has(k) && seriesByPair[k]);
  if (!visibleSeries.length) {
    ctx.fillStyle = '#5f6b76'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('当前筛选下无数据', w / 2, h / 2);
    renderLegend(pairs, seriesByPair);
    return;
  }

  // 时间范围
  const times = visibleSeries.flatMap(s => seriesByPair[s].map(d => d.time));
  const tMin = Math.min(...times), tMax = Math.max(...times);
  // 值范围
  const vals = visibleSeries.flatMap(s => seriesByPair[s].map(d => d.value));
  let vMin = Math.min(...vals), vMax = Math.max(...vals);
  if (activeMetric === 'success_rate') { vMin = 0; vMax = 100; }
  else { vMin = vMin > 0 ? vMin * 0.9 : 0; vMax = vMax * 1.1; }
  if (vMax === vMin) vMax = vMin + 1;

  // 绘图区域
  const pad = { l: 50, r: 16, t: 16, b: 36 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;

  // 网格 + Y 轴
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1; ctx.fillStyle = '#5f6b76'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + ch * i / 4;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + cw, y); ctx.stroke();
    const val = vMax - (vMax - vMin) * i / 4;
    ctx.fillText(formatVal(val), pad.l - 8, y);
  }

  // X 轴时间标签
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const xTicks = Math.min(6, allRuns.length);
  for (let i = 0; i <= xTicks; i++) {
    const t = tMin + (tMax - tMin) * i / xTicks;
    const x = pad.l + cw * i / xTicks;
    ctx.fillText(formatTime(t), x, pad.t + ch + 8);
  }

  // 直线折线（缓存像素坐标供 hover 命中测试）
  chartHits = [];
  visibleSeries.forEach(k => {
    const data = seriesByPair[k];
    const color = colorOf(k.split('|')[0]);
    ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.lineJoin = 'round';
    const pts = data.map(d => ({
      x: pad.l + ((d.time - tMin) / (tMax - tMin || 1)) * cw,
      y: pad.t + (1 - (d.value - vMin) / (vMax - vMin || 1)) * ch,
    }));
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
    ctx.fillStyle = color;
    pts.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
    });
    const [provider, model] = k.split('|');
    data.forEach((d, i) => chartHits.push({ x: pts[i].x, y: pts[i].y, time: d.time, value: d.value, provider, model, color }));
  });

  renderLegend(pairs, seriesByPair);
}

// hover：命中点放大高亮 + 竖参考线，tooltip 展示值
function drawChartHighlight(hit) {
  drawChart();
  if (!hit || !chartCtx) return;
  const ctx = chartCtx;
  const pad = { l: 50, r: 16, t: 16, b: 36 };
  const ch = 320 - pad.t - pad.b;
  // 竖参考线
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(hit.x, pad.t); ctx.lineTo(hit.x, pad.t + ch); ctx.stroke();
  ctx.setLineDash([]);
  // 高亮点
  ctx.fillStyle = hit.color;
  ctx.beginPath(); ctx.arc(hit.x, hit.y, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#0a0d10'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(hit.x, hit.y, 4.5, 0, Math.PI * 2); ctx.stroke();
}

// 趋势图 hover 交互：最近点命中（半径 12px）
function bindChartHover() {
  const tooltip = document.getElementById('chartTooltip');
  let hovered = null;

  chartCanvas.addEventListener('mousemove', e => {
    const rect = chartCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    let best = null, bestDist = 12 * 12;
    for (const h of chartHits) {
      const d = (h.x - mx) ** 2 + (h.y - my) ** 2;
      if (d < bestDist) { bestDist = d; best = h; }
    }
    if (best !== hovered) {
      hovered = best;
      drawChartHighlight(hovered);
      if (!hovered) { tooltip.style.display = 'none'; return; }
      tooltip.innerHTML = `<div class="t-time">${formatTime(hovered.time)}</div>
        <div class="t-row">
          <span class="t-dot" style="background:${hovered.color}"></span>
          <span class="t-model">${escapeHtml(hovered.model)}</span>
          <span class="t-provider">${escapeHtml(hovered.provider)}</span>
        </div>
        <span class="t-val">${formatMetricValue(hovered.value)}</span>`;
    }
    if (hovered) {
      tooltip.style.display = 'block';
      const card = chartCanvas.parentElement;
      const maxLeft = card.clientWidth - tooltip.offsetWidth - 12;
      const maxTop = card.clientHeight - tooltip.offsetHeight - 8;
      tooltip.style.left = Math.max(12, Math.min(hovered.x + 20, maxLeft)) + 'px';
      // 悬停在命中点上方，少遮曲线本体
      tooltip.style.top = Math.max(4, Math.min(hovered.y - tooltip.offsetHeight - 18, maxTop)) + 'px';
    }
  });
  chartCanvas.addEventListener('mouseleave', () => {
    hovered = null;
    tooltip.style.display = 'none';
    drawChart();
  });
}

function formatVal(v) {
  if (activeMetric === 'success_rate') return v.toFixed(0) + '%';
  if (activeMetric === 'tps') return v.toFixed(0);
  return Math.round(v);
}

function renderLegend(pairs, seriesByPair) {
  const el = document.getElementById('legend');
  el.innerHTML = pairs.map(k => {
    const color = colorOf(k.split('|')[0]);
    const active = activeKeys.has(k);
    const has = !!seriesByPair[k];
    if (!has) return '';
    const [provider, model] = k.split('|');
    return `<div class="legend-item${active ? '' : ' disabled'}" data-key="${escapeHtml(k)}">
      <span class="swatch" style="background:${color}"></span>
      <span>${escapeHtml(model)} <span style="color:var(--text-faint)">${escapeHtml(provider)}</span></span>
    </div>`;
  }).join('');
  el.querySelectorAll('.legend-item').forEach(item => {
    item.addEventListener('click', () => {
      const k = item.dataset.key;
      if (activeKeys.has(k)) activeKeys.delete(k); else activeKeys.add(k);
      drawChart();
    });
  });
}

// ── sparkline hover（复用趋势图 tooltip 交互）──────

function formatMetricValue(v) {
  if (activeMetric === 'success_rate') return v.toFixed(1) + '%';
  if (activeMetric === 'tps') return v.toFixed(1) + ' tok/s';
  if (activeMetric === 'itl_ms') return formatItl(v) + ' ms';
  return Math.round(v) + ' ms';
}

// ITL 展示：个位数保留一位小数，其余取整
function formatItl(v) {
  return v < 10 ? v.toFixed(1) : Math.round(v).toString();
}

function formatTime(t) {
  const d = new Date(t);
  const span = allRuns.length > 1
    ? new Date(allRuns[allRuns.length-1].started_at).getTime() - new Date(allRuns[0].started_at).getTime()
    : 0;
  if (span > 7 * 86400000) return `${d.getMonth()+1}/${d.getDate()}`;
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// sparkline hover：命中测试 + tooltip（每个 sparkline 自带命中点缓存）
let sparkHitsByCanvas = new WeakMap();
let sparkHoverState = null; // { canvas, dot }

// 独立于趋势图 tooltip：挂在 resultsCard（position:relative）下的专用元素，
// renderResults 重建表格时随 innerHTML 一起销毁，重建后由本函数补回
function sparkTooltip() {
  let tip = document.getElementById('sparkTooltip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'sparkTooltip';
    tip.className = 'chart-tooltip';
    document.getElementById('resultsCard').appendChild(tip);
  }
  return tip;
}

function bindSparkHover(cv) {
  let hovered = null;

  cv.addEventListener('mousemove', e => {
    const tooltip = sparkTooltip();
    const hits = sparkHitsByCanvas.get(cv) || [];
    const rect = cv.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (cv.dataset.w / rect.width || 1);
    const my = (e.clientY - rect.top) * (cv.dataset.h / rect.height || 1);
    let best = null, bestDist = 12 * 12;
    for (const h of hits) {
      const d = (h.x - mx) ** 2 + (h.y - my) ** 2;
      if (d < bestDist) { bestDist = d; best = h; }
    }
    if (best !== hovered) {
      // 恢复上一个 sparkline
      if (sparkHoverState) { sparkHoverState.dot.remove(); sparkHoverState = null; }
      hovered = best;
      if (hovered) {
        // 高亮圆点叠加在 sparkline 上（td 已 position:relative）
        const dot = document.createElement('div');
        dot.style.cssText = `position:absolute;width:9px;height:9px;border-radius:50%;` +
          `background:${hovered.color};border:2px solid #0a0d10;pointer-events:none;` +
          `left:${cv.offsetLeft + hovered.x - 4.5}px;top:${cv.offsetTop + hovered.y - 4.5}px;`;
        cv.parentElement.appendChild(dot);
        sparkHoverState = { canvas: cv, dot };
        const [provider, model] = hovered.pair.split('|');
        tooltip.innerHTML = `<div class="t-time">${formatTime(hovered.time)}</div>
          <div class="t-row">
            <span class="t-dot" style="background:${hovered.color}"></span>
            <span class="t-model">${escapeHtml(model)}</span>
            <span class="t-provider">${escapeHtml(provider)}</span>
          </div>
          <span class="t-val">${formatMetricValue(hovered.value)}</span>`;
      } else {
        tooltip.style.display = 'none';
        return;
      }
    }
    if (hovered) {
      tooltip.style.display = 'block';
      const card = document.getElementById('resultsCard');
      const cvRect = cv.getBoundingClientRect(), cardRect = card.getBoundingClientRect();
      const maxLeft = cardRect.width - tooltip.offsetWidth - 12;
      const maxTop = cardRect.height - tooltip.offsetHeight - 8;
      tooltip.style.left = Math.max(12, Math.min(cvRect.left - cardRect.left + hovered.x * cvRect.width / cv.dataset.w + 10, maxLeft)) + 'px';
      // 悬停在命中点上方，少遮曲线本体（与趋势图 tooltip 同间距）
      tooltip.style.top = Math.max(4, Math.min(cvRect.top - cardRect.top + hovered.y * cvRect.height / cv.dataset.h - tooltip.offsetHeight - 18, maxTop)) + 'px';
    }
  });
  cv.addEventListener('mouseleave', () => {
    hovered = null;
    if (sparkHoverState) { sparkHoverState.dot.remove(); sparkHoverState = null; }
    sparkTooltip().style.display = 'none';
  });
}

// ── 交互 ──────────────────────────────────────────

document.querySelectorAll('[data-metric]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-metric]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeMetric = btn.dataset.metric;
    activeKeys.clear(); // 切换指标重置选中
    renderResults(); // sparkline 跟随指标
    drawChart();
  });
});

document.querySelectorAll('[data-range]').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeRange = btn.dataset.range;
    // 14 天档按需补拉历史（首屏只加载 7 天，控制初始流量）
    const def = RANGE_DEFS[activeRange];
    if (def.lazy) await extendLoadedDays(MAX_DAYS);
    renderProviderChips();
    renderResults();
    drawChart();
  });
});

// ── 启动 ──────────────────────────────────────────

async function init() {
  allRuns = await loadAllData(PRELOAD_DAYS);
  loadedDays = PRELOAD_DAYS;
  if (!allRuns.length) {
    document.getElementById('resultsCard').innerHTML = '<div class="empty">暂无巡检数据。<br> Fork 仓库并启用 Patrol workflow 后，数据会在此自动展示。</div>';
    return;
  }
  assignProviderColors(allRuns);
  renderLastRun(allRuns[allRuns.length - 1]);
  renderMetrics(allRuns[allRuns.length - 1]);
  renderProviderChips();
  renderResults();
  initChart();
  drawChart();
}

init();
</script>
</body>
</html>
